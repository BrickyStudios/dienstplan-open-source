  <!-- Das "N" steht als Pfad, nicht als <text>. Vorher stand hier
       font-family="'Arial Black', Arial, sans-serif": eine Systemschrift, die auf dem
       Rechner des Besuchers fehlen kann und auf jedem System anders aussieht. Ein
       Zeichen, das im Zweifel gar nicht da ist, taugt nicht als Markenzeichen; als
       Pfad ist die Form festgelegt und braucht nichts vom Betriebssystem.

       Der Grund traegt die Akzentfarbe des Handbuchs (#0E5C55 aus app/globals.css),
       das Zeichen Weiss: 7,8:1 Kontrast. Vorher war der Grund #4b41e1, ein
       Blauviolett, das in keinem Farbtoken der Seite vorkommt. -->
  <rect width="512" height="512" rx="108" fill="#0E5C55"/>
